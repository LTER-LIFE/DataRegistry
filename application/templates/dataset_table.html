{% extends "base.html" %}

{% block vendor_css %}
<link rel="stylesheet" href="{{ url_for('static', filename ='vendor/leaflet.markercluster/MarkerCluster.css')}}">
<link rel="stylesheet" href="{{ url_for('static', filename ='vendor/leaflet.markercluster/MarkerCluster.Default.css')}}">
{% endblock %}

{% block content %}
<div class="row datasets-overview-container">
    <div class="col-12 col-md-8 offset-md-4 mb-4 mt-4 mt-md-0">
        <ul id="datasets-view-tabs" class="nav nav-tabs" role="tablist">
            <li class="nav-item d-flex lh-1" role="presentation">
                <i class="bi bi-list-task me-1"></i>

                <button
                    id="datasets-list-button"
                    class="nav-link active"
                    data-bs-target="#datasets-list-tab"
                    data-bs-toggle="tab"
                    aria-controls="datasets-list-tab"
                    aria-selected="true"
                    role="tab"
                    type="button"
                >
                    List
                </button>
            </li>

            <li class="nav-item d-flex lh-1" role="presentation">
                <i class="bi bi-geo-alt-fill me-1"></i>

                <button
                    id="datasets-map-button"
                    class="nav-link"
                    data-bs-target="#datasets-map-tab"
                    data-bs-toggle="tab"
                    aria-controls="datasets-map-tab"
                    aria-selected="false"
                    role="tab"
                    type="button"
                >
                    Map
                </button>
            </li>
        </ul>
    </div>

    <div class="col-md-4 order-first order-md-0">
        <h2>Filters</h2>

        <form id="index_search_form">
           <div class="mb-4">
               <label for="free" class="form-label">Free text</label>
               <input
                   type="text"
                   class="form-control js-input"
                   id="free"
                   name="free"
               >
           </div>

           <div class="mb-4">
               <label class="form-label">Time period</label>
               <div id="slider-range" class="mt-4 mx-3">
                   <div id="custom-handle-min" class="ui-slider-handle">
                       <small class="slider-handle-label"></small>
                   </div>
                   <div id="custom-handle-max" class="ui-slider-handle">
                       <small class="slider-handle-label"></small>
                   </div>
               </div>

               <input
                   type="hidden"
                   class="js-input"
                   id="min_year_input"
                   name="min_year"
               >

               <input
                   type="hidden"
                   class="js-input"
                   id="max_year_input"
                   name="max_year"
               >
           </div>

           <div class="mb-4">
               <label class="form-label" for="area">Area</label>

               <select class="form-select" name="area" aria-label="Select an area">
                   <option id="area-none" value="">
                       None
                   </option>

                   <option
                     id="area-veluwe"
                     value="{% include "boundaries/veluwe.txt" %}"
                   >
                       Veluwe
                   </option>

                   <option
                     id="area-ijsselmeergebied"
                     value="{% include "boundaries/ijsselmeergebied.txt" %}"
                   >
                       IJsselmeergebied
                   </option>

                   <option id="area-custom" value="">
                       Custom
                   </option>
               </select>

               <div id="input-map" class="visually-hidden">
                   <input
                        class="form-control js-input visually-hidden"
                        id="spatial_coverage"
                        name="spatial_coverage"
                        type="text"
                        value=""
                   />

                   <div class="map--small mt-3" id="select-geo-loc"></div>
               </div>
           </div>
       </form>
    </div>

    <div class="col-md-8">
        <div class="tab-content">
            <div
                id="datasets-list-tab"
                class="tab-pane fade show active"
                role="tabpanel"
                aria-labelledby="datasets-list-button"
            >
                <div
                    class="datasets-list"
                    data-add-to-download-list-base-url="{{ url_for('main_bp.add_to_download_list', dataset_id=-999) }}"
                    data-remove-from-download-list-base-url="{{ url_for('main_bp.remove_from_download_list', dataset_id=-999) }}"
                ></div>
            </div>

            <div
                id="datasets-map-tab"
                class="tab-pane fade"
                role="tabpanel"
                aria-labelledby="datasets-map-button"
            >
                <div id="datasets-map" class="map"></div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block vendor_js %}
<script src="{{ url_for('static', filename='vendor/leaflet.markercluster/leaflet.markercluster.js')}}"></script>
{% endblock %}

{% block app_js %}
<script type="module">
import { appState } from '{{ url_for('static', filename='js/app-state.js')}}'
import { setMapViewAsFilterControl } from '{{ url_for('static', filename='js/leaflet-control-set-map-view-as-filter.js')}}'

const areas = ['veluwe', 'ijsselmeergebied']
const downloadList = {{ download_list | tojson }};

function parseUrlParams() {
    const queryString = window.location.search

    if (queryString) {
        const params = new URLSearchParams(queryString)
        const area = params.get('area').toLowerCase()

        if (areas.includes(area)) {
            $(`select[name="area"] option[id=area-${area}]`)
                .prop("selected", true)

            $('select[name="area"]').trigger('change')
        } else {
            alert('An invalid area was requested. Reverting to a previously saved area filter or no area filter.')
        }
    }
}

function getFormData() {
    // only a subset of form fields should be sent to the search index,
    // which are defined below. E.g. the leaflet and area input are excluded.
    const formKeys = ['free', 'min_year', 'max_year', 'spatial_coverage']
    const form = document.getElementById('index_search_form')
    const formData = new FormData(form)
    const query = {}

    for (const [key, value] of formData) {
        if (formKeys.includes(key)) {
            query[key] = value
        }
    }

    return query
}

// Set spatial coverage or show the map when selecting an Area option
function setSpatialCoverageFilter(areaId = null, spatialCoverageWkt = "") {
    const selectedId = areaId || $('select[name="area"] option:selected').attr('id')

    if (selectedId === 'area-custom') {
        $('#input-map').removeClass('visually-hidden');

        $('#spatial_coverage').val(spatialCoverageWkt)

        initInputByMap()
    } else {
        $('#input-map').addClass('visually-hidden');

        $('#spatial_coverage')
            .val($(`#${selectedId}`).val())
            .trigger('change')
    }
}

function debounce(func, wait) {
  let timeout;
  return function executed(...args) {
    const later = () => {
      clearTimeout(timeout);
      func(...args);
    };
    clearTimeout(timeout);
    timeout = setTimeout(later, wait);
  };
}

function applyFiltersFromLocalStorage() {
    const savedFilters = localStorage.getItem('last_search_filters');

    if (savedFilters) {
        const filters = JSON.parse(savedFilters);

        // reflect saved filters in the UI
        $('#free').val(filters.free);
        $('#min_year_input').val(filters.min_year);
        $('#max_year_input').val(filters.max_year);

        $(`select[name="area"] option[id=${filters.areaId}]`)
                .prop("selected", true)

        setSpatialCoverageFilter(filters.areaId, filters.spatial_coverage)

        // refresh search results
        fetchData(filters);
    }
}

function saveFiltersToLocalStorage(formData) {
    formData['areaId'] = $('select[name="area"] option:selected').attr('id')

    localStorage.setItem('last_search_filters', JSON.stringify(formData))
}

function fetchData(query) {
    // the selection of datasets is stored, so when the map tab is
    // activated, the data does not need to be retrieved a second time.
    appState.datasets.selection = []

    $.ajax({
            url: '{{ url_for('main_bp.query_index') }}', // The endpoint to send the data to
            type: 'POST',  // Use POST for sending the data in the body
            contentType: 'application/json', // Tell the server we are sending JSON
            data: JSON.stringify(query), // Convert the JavaScript object to a JSON string
            processData: false,

            success: function(data) {
                // Process the successful response
                // Clear the existing cards first
                $('.datasets-list').empty();

                if (data.hits && data.hits.length > 0) {
                    appState.datasets.selection = data.hits

                    $('.datasets-list').append('<ul class="list-unstyled"></ul>');

                    data.hits.forEach(function(dataset) {
                        addDataset(dataset._source);
                    });
                } else {
                    $('.datasets-list').append("<p>No results found.</p>");
                }

                if (appState.datasets.mapTabActive){
                    updateMap()
                }
            },
            error: function(xhr, status, error) {
                console.error("Error fetching data:", error);
                $('.datasets-list').append("<p>An error occurred while fetching data. Please try again later.</p>");
            }
        });
}

function addDataset(dataset) {
    const $datasetsList = $('.datasets-list');

    const isInDownloadList = downloadList.includes(dataset.dataset_id);

    const baseUrl = isInDownloadList
        ? $datasetsList.data('remove-from-download-list-base-url')
        : $datasetsList.data('add-to-download-list-base-url');
    const downloadListUrl = baseUrl.replace(/-999$/, dataset.dataset_id);

    const downloadListText = isInDownloadList
        ? 'remove from download list'
        : 'add to download list';

    const itemHtml = `
        <li class="datasets-list__item">
            <h3>
                <a class="link-underline-hover link-offset-2" href="${dataset.url}">
                    ${dataset.title}
                    <i class="bi bi-arrow-right-short heading-icon"></i>
                </a>
            </h3>

            <p class="mb-0 text--medium truncate-text--2">
                ${dataset.description.substring(0, 300)}...
            </p>

            <div class="d-flex justify-content-end">
                <a
                    class="btn btn-link btn-sm me-3 p-0 link-underline-hover"
                    href="${downloadListUrl}"
                >
                    ${downloadListText}
                </a>

                <a
                    class="btn btn-link btn-sm p-0 link-underline-hover"
                    href="${dataset.url}"
                >
                    read more
                </a>
            </div>
        </li>
    `;

$('.datasets-list ul').append(itemHtml);
}

function initMap() {
    const osm = new L.TileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        minZoom: 2,
        maxZoom: 19,
        attribution: '© <a href="https://openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    })

    const esri = new L.TileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
        minZoom: 2,
        maxZoom: 19,
        attribution: 'Sources: Esri, Maxar, Earthstar Geographics, and the GIS User Community | Powered by Esri'
    })

    appState.datasets.map.mapInstance = new L.Map('datasets-map', {
        doubleClickZoom: false,
        maxBounds: [[90, -270], [-90, 270]],
    })

    osm.addTo(appState.datasets.map.mapInstance)

    const baseMaps = { "OpenStreetMap": osm, "Esri Satellite": esri }
    L.control.layers(baseMaps).addTo(appState.datasets.map.mapInstance)

    setMapViewAsFilterControl({ position: 'bottomleft' })
        .addTo(appState.datasets.map.mapInstance)

    appState.datasets.map.markerClustersGroup = L.markerClusterGroup()
        .addTo(appState.datasets.map.mapInstance)

    appState.datasets.map.areaGroup = L.featureGroup()
        .addTo(appState.datasets.map.mapInstance)

    appState.datasets.map.mapInstance.on('click', function () {
        appState.datasets.map.areaGroup.clearLayers()
    })

    updateMap()
}

function updateMap() {
    const areaFilter = $('#spatial_coverage').val()

    if (areaFilter !== "" && areaFilter !== "GEOMETRYCOLLECTION EMPTY") {
        const geoJson = createGeoJSONFromWkt(areaFilter)
        const geoJsonLayer = L.geoJSON(JSON.parse(geoJson))
        const bounds = geoJsonLayer.getBounds()

        if (boundsValid(bounds)) {
            appState.datasets.map.mapInstance.fitBounds(
                bounds,
                { padding: [20, 20] }
            )
        }
    } else {
        appState.datasets.map.mapInstance.setView([52.450988, 5.543826], 9)
    }

    appState.datasets.map.markerClustersGroup.clearLayers()

    // add a new marker with a popup
    let all_points = []
    appState.datasets.selection.forEach(item => {
        const dataset = item._source

        all_points.push(L.geoJson(dataset.dataset_spatial_coverage.centroid, {
            pointToLayer: (feature, latlng) => {
                const popup = document.createElement("div")
                popup.innerHTML = `
                    <h2> \
                        <a class="text-decoration-none" href="${dataset.url}"> \
                            ${dataset.title} \
                        </a> \
                    </h2> \
                    <p>
                        ${dataset.description.substring(0, 125)}... \
                        <a href="${dataset.url}">read more</a> \
                    </p>`

                const button = document.createElement("button")
                button.className = "btn btn-sm btn-primary"
                button.innerHTML= "Show area"
                button.onclick = function() {
                    if (appState.datasets.map.areaGroup.getLayers().length >=1) {
                        appState.datasets.map.areaGroup.clearLayers()
                    } else {
                        const area = L.geoJson(dataset.dataset_spatial_coverage.geometry)
                        area.addTo(appState.datasets.map.areaGroup)
                    }
                }

                popup.appendChild(button)

                return L.marker(latlng).bindPopup(popup)
            }
        }))
    })

    appState.datasets.map.markerClustersGroup.addLayer(L.layerGroup(all_points))
}

$(function () {
    const minHandle = $("#custom-handle-min .slider-handle-label")
    const maxHandle = $("#custom-handle-max .slider-handle-label")

    $("#slider-range").slider({
        range: true,
        min: 1900,
        max: 2026,
        values: [1990, 2026],
        create: function () {
            minHandle.text( $( this ).slider("option", "values")[0] );
            maxHandle.text( $( this ).slider("option", "values")[1] );
        },
        slide: function (event, ui) {
            minHandle.text(ui.values[0])
            maxHandle.text(ui.values[1])

            // Update the hidden form fields
            $("#min_year_input").val(ui.values[0]).trigger('change');
            $("#max_year_input").val(ui.values[1]).trigger('change');
        }
    });

    // Also initialize the hidden fields with the slider's default values
    const initialValues = $("#slider-range").slider("option", "values");
    $("#min_year_input").val(initialValues[0]);
    $("#max_year_input").val(initialValues[1]);
});

$(document).ready(function() {
    applyFiltersFromLocalStorage()

    const debouncedFetchData = debounce(fetchData, 100);

    $('#index_search_form').on('change input', '.js-input', function() {
        const formData = getFormData()

        saveFiltersToLocalStorage(formData)

        debouncedFetchData(formData);
    });

    $('#datasets-view-tabs [data-bs-toggle="tab"]').on('shown.bs.tab', function (e) {
        appState.datasets.mapTabActive = false

        // The map can only be initialized when the map tab is active
        if (e.target.id === 'datasets-map-button') {
            appState.datasets.mapTabActive = true

            if (!appState.datasets.map.mapInstance) {
                initMap()
            } else {
                updateMap()
            }
        }
    })

    $('select[name="area"]').change(function() {
        setSpatialCoverageFilter()
    });

    parseUrlParams()
});



</script>

{% endblock %}
