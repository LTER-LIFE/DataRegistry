{% extends "nioo_bootstrap.html" %}

{% block content %}
    <h1>Your Shopping Cart</h1>

    {% if cart %}
        <ul>
        {% for item in cart %}
            <li>
                {{ item.title }} (ID: {{ item.dataset_id }})
                <a href="{{ url_for('remove_from_cart', dataset_id=item.dataset_id) }}">[Remove]</a>
            </li>
        {% endfor %}
        </ul>

        <a href="{{ url_for('export_cart') }}">Export Cart</a><br><br>
        <a href="{{ url_for('empty_cart') }}">Empty Cart</a>
    {% else %}
        <p>Your cart is empty.</p>
    {% endif %}

    <br><a href="{{ url_for('main_bp.datasets') }}">Back to datasets</a>
{% endblock %}
