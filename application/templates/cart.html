{% extends "base.html" %}

{% block content %}
    {% if cart %}
        <ul class="mb-paragraph text-formatted">
        {% for item in cart %}
            <li>
                {{ item.title }}
                <a class="ps-2" href="{{ url_for('main_bp.remove_from_cart', dataset_id=item.dataset_id) }}">Remove</a>
            </li>
        {% endfor %}
        </ul>

        <ul class="list-inline mb-5">
            <li class="list-inline-item">
                <a class="btn btn-primary" href="{{ url_for('main_bp.export_cart') }}">Export Cart</a>
            </li>
            <li class="list-inline-item">
                <a class="btn btn-outline-secondary" href="{{ url_for('main_bp.empty_cart') }}">Empty Cart</a>
            </li>
        </ul>
    {% else %}
        <p>Your cart is empty.</p>
    {% endif %}

    <a href="{{ url_for('main_bp.datasets') }}">Back to datasets</a>
{% endblock %}
