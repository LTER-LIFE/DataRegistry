{% extends "base.html" %}

{% block content %}
    {% if download_list %}
        <ul class="mb-paragraph text-formatted">
        {% for item in download_list %}
            <li>
                {{ item.title }}
                <a class="ps-2" href="{{ url_for('main_bp.remove_from_download_list', dataset_id=item.dataset_id) }}">Remove</a>
            </li>
        {% endfor %}
        </ul>

        <ul class="list-inline mb-5">
            <li class="list-inline-item">
                <a class="btn btn-primary" href="{{ url_for('main_bp.export_download_list') }}">Export list</a>
            </li>
            <li class="list-inline-item">
                <a class="btn btn-outline-secondary" href="{{ url_for('main_bp.empty_download_list') }}">Empty list</a>
            </li>
        </ul>
    {% else %}
        <p>Your download list is empty.</p>
    {% endif %}

    <a href="{{ url_for('main_bp.datasets') }}">Back to datasets</a>
{% endblock %}
