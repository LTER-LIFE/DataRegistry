<header class="header">
    <nav class="navbar navbar-expand-lg bg-white">
      <div class="container">
        <a class="navbar-brand" href="https://lter-nl.nl/en/data">
          <img
            src="{{ url_for('static', filename='img/logo-lter-nl.png') }}"
            alt="LTER-NL logo"
            height="92"
            class="d-inline-block me-3"
          >
          LTER-NL Data Registry <small class="text-black-50">(beta)</small>
        </a>

        <button
          class="navbar-toggler ms-auto"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbar-main-menu"
          aria-controls="navbar-main-menu"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbar-main-menu">
          <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a
                class="nav-link {% if request.path == url_for('main_bp.home') %} active{% endif %}"
                href="{{ url_for('main_bp.home') }}"
              >
                  Map
              </a>
            </li>

            <li class="nav-item">
              <a
                class="nav-link {% if request.path == url_for('main_bp.datasets') %}active{% endif %}"
                href="{{ url_for('main_bp.datasets') }}"
              >
                  Table
              </a>
            </li>

            <li class="nav-item">
              <a
                class="nav-link {% if request.path == url_for('main_bp.stage_dataset') %}active{% endif %}"
                href="{{ url_for('main_bp.stage_dataset') }}"
              >
                  Register dataset
              </a>
            </li>

            <li class="nav-item">
              <a
                class="nav-link {% if request.path == url_for('main_bp.download_list') %}active{% endif %}"
                href="{{ url_for('main_bp.download_list') }}"
              >
                  Download list
                  {% if download_list_item_count > 0 %} ({{ download_list_item_count }}) {% endif %}
              </a>
            </li>

            <li class="nav-item">
              <a
                class="nav-link {% if request.path == url_for('main_bp.about') %}active{% endif %}"
                href="{{ url_for('main_bp.about') }}"
              >
                  About
              </a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
</header>
