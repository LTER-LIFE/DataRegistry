<footer class="footer">
    <div class="container">
        <div class="footer-meta d-flex align-items-center">
            <a
              class="me-2 text-decoration-none"
              href="https://lter-life.nl/en"
              target="_blank"
            >
                <img
                  src="{{ url_for('static', filename='img/LTER-LIFE-logo.svg') }}"
                  alt="LTER-LIFE logo"
                  height="42"
                >
            </a>

            <p class="mb-0">
                {% autoescape false %}
                    {{ _(
                        'LTER-NL Data Registry is an initiative of %(lter_life_link)s',
                        lter_life_link='<a href="https://lter-life.nl/en" target="_blank">LTER-LIFE</a>'
                      ) }}
                {% endautoescape %}
            </p>
        </div>
    </div>
</footer>
