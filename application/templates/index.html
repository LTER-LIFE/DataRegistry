{% extends "nioo_bootstrap.html" %}

{% block vendor_css %}
<link rel="stylesheet" href="{{ url_for('static', filename ='vendor/leaflet.markercluster/MarkerCluster.css')}}">
<link rel="stylesheet" href="{{ url_for('static', filename ='vendor/leaflet.markercluster/MarkerCluster.Default.css')}}">
{% endblock %}

{% block content_container_classes %}content-container--narrow{% endblock %}

{% block content %}
<div id="map" class="map"></div>
{% endblock %}

{% block vendor_js %}
<script src="{{ url_for('static', filename='vendor/leaflet.markercluster/leaflet.markercluster.js')}}"></script>
{% endblock %}

{% block app_js %}
<script type="application/javascript">
var map = L.map('map').setView([52.075919, 5.891922],10)

var osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
          });
osm.addTo(map);

// Tile map layers
googleStreets = L.tileLayer('https://{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
    maxZoom: 20,
    subdomains:['mt0','mt1','mt2','mt3']
 });

googleSat = L.tileLayer('https://{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}',{
   maxZoom: 20,
   subdomains:['mt0','mt1','mt2','mt3']
});

// Layer control
var baseLayers ={
    "Google Streets": googleStreets,
    "Google Satellite": googleSat,
    "Open StreetMap": osm
};

L.control.layers(baseLayers).addTo(map);

// Cluster groups
var ClusterMarkers = L.markerClusterGroup().addTo(map);
var Areagroup = L.featureGroup().addTo(map)
var MarkerGroup = L.featureGroup().addTo(map)

// on click clear group
 map.on('click', function (e){
     Areagroup.clearLayers();
 });

const geo_json = {{ list_o_geo |tojson | safe}};
// add a new marker with a popup overtop
let all_points = [];
Object.entries(geo_json).forEach(dataset_items => {
    dataset = dataset_items[1];
    all_points.push(L.geoJson(dataset.centroid, {
        pointToLayer: (feature, latlng) => {
            const div = document.createElement("div");
            div.innerHTML = `
                <h2> \
                    <a class="text-decoration-none" href="${dataset.properties.url}"> \
                        ${dataset.properties.title} \
                    </a> \
                </h2> \
                <p>
                    ${dataset.properties.description.substring(0, 125)}... \
                    <a href="${dataset.properties.url}">read more</a> \
                </p>
                <dl> \
                    <dt>Temporal coverage</dt> \
                    <dd>${dataset.properties.temporal_coverage}</dd> \
                    <dt>Creator</dt> \
                    <dd>${dataset.properties.creator}</dd> \
                </dl>`

            var area_poly = dataset.geometry;
            const button = document.createElement("button");
            button.className = "btn btn-sm btn-primary"
            button.innerHTML= "Show area";
            button.onclick = function() {
                if (Areagroup.getLayers().length >=1){
                    Areagroup.clearLayers()
                } else {
                const area = L.geoJson(area_poly);
                area.addTo(Areagroup);
                }
            }
            div.appendChild(button);
            return L.marker(latlng).bindPopup(div);
        }
    })
    );
});

ClusterMarkers.addLayer(L.layerGroup(all_points));

 </script>

{% endblock %}
