name: eco-search-engine

services:
  app:
    build:
      context: .
      args:
        PORT: ${PORT}
    container_name: ${COMPOSE_PROJECT_NAME}-app
    env_file: .env
    ports:
      - "${PORT}:${PORT}"  # Map the port from .env
    volumes:
      - certs:/app/certs
    depends_on:
      database:
        condition: service_healthy
      es01:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: .
          target: /app
          # Exclude the project virtual environment — it could be for a
          # different platform in the container
          ignore:
            - .venv/
            - certs/

        # Rebuild the image if dependencies change by checking uv.lock
        - action: rebuild
          path: ./uv.lock

  database:
    image: kartoza/postgis:16-3.4
    container_name: ${COMPOSE_PROJECT_NAME}-database
    env_file: .env
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASS=${DB_PWD}
      - POSTGRES_DBNAME=${DB_NAME}
      - POSTGRES_MULTIPLE_EXTENSIONS=postgis
      - GENERATE_ALL_LOCALE=0
    ports:
      - "25432:5432"
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: "PGPASSWORD=$${POSTGRES_PASS} pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DBNAME}"
      interval: 10s
      retries: 50
      start_period: 30s
      timeout: 10s

  es_setup:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_STACK_VERSION}
    container_name: ${COMPOSE_PROJECT_NAME}-es-setup
    volumes:
      - certs:/usr/share/elasticsearch/config/certs
    user: "0"
    command: >
      bash -c '
        if [ x${ELASTIC_PASSWORD} == x ]; then
          echo "Set the ELASTIC_PASSWORD environment variable in the .env file";
          exit 1;
        fi;
        if [ ! -f config/certs/ca.zip ]; then
          echo "Creating CA";
          bin/elasticsearch-certutil ca --silent --pem -out config/certs/ca.zip;
          unzip config/certs/ca.zip -d config/certs;
        fi;
        if [ ! -f config/certs/certs.zip ]; then
          echo "Creating certs";
          echo -ne \
          "instances:\n"\
          "  - name: es01\n"\
          "    dns:\n"\
          "      - es01\n"\
          "      - localhost\n"\
          "    ip:\n"\
          "      - 127.0.0.1\n"\
          > config/certs/instances.yml;
          bin/elasticsearch-certutil cert --silent --pem -out config/certs/certs.zip --in config/certs/instances.yml --ca-cert config/certs/ca/ca.crt --ca-key config/certs/ca/ca.key;
          unzip config/certs/certs.zip -d config/certs;
        fi;
        echo "Setting file permissions"
        chown -R root:root config/certs;
        find . -type d -exec chmod 750 \{\} \;;
        find . -type f -exec chmod 640 \{\} \;;
        echo "Waiting for Elasticsearch availability";
        until curl -s --cacert config/certs/ca/ca.crt https://es01:9200 | grep -q "missing authentication credentials"; do sleep 30; done;
        echo "All done!";
      '
    healthcheck:
      test: [ "CMD-SHELL", "[ -f config/certs/es01/es01.crt ]" ]
      interval: 1s
      timeout: 5s
      retries: 120

  es01:
    depends_on:
      es_setup:
        condition: service_healthy
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_STACK_VERSION}
    container_name: ${COMPOSE_PROJECT_NAME}-es01
    volumes:
      - certs:/usr/share/elasticsearch/config/certs
      - esdata01:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    environment:
      - node.name=es01
      - cluster.name=${ELASTIC_CLUSTER_NAME}
      - cluster.initial_master_nodes=es01
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - bootstrap.memory_lock=true
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=true
      - xpack.security.http.ssl.key=certs/es01/es01.key
      - xpack.security.http.ssl.certificate=certs/es01/es01.crt
      - xpack.security.http.ssl.certificate_authorities=certs/ca/ca.crt
      - xpack.security.transport.ssl.enabled=true
      - xpack.security.transport.ssl.key=certs/es01/es01.key
      - xpack.security.transport.ssl.certificate=certs/es01/es01.crt
      - xpack.security.transport.ssl.certificate_authorities=certs/ca/ca.crt
      - xpack.security.transport.ssl.verification_mode=certificate
      - xpack.license.self_generated.type=${ELASTIC_LICENSE}
    mem_limit: ${ELASTIC_MEM_LIMIT}
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s --cacert config/certs/ca/ca.crt https://localhost:9200 | grep -q 'missing authentication credentials'",
        ]
      interval: 10s
      timeout: 10s
      retries: 120

  backup:
    image: kartoza/postgis:16-3.4
    container_name: ${COMPOSE_PROJECT_NAME}-backup
    env_file: .env
    volumes:
      - ./utilities/backup/backup.sh:/backup.sh:ro
      - ${BACKUP_DIR}:/var/backups/ecometa
    entrypoint: [ "/bin/bash", "/backup.sh" ]
    restart: "no"
    depends_on:
      database:
        condition: service_healthy

networks:
  default:
    name: ${COMPOSE_PROJECT_NAME}

volumes:
  db_data:
    name: ${COMPOSE_PROJECT_NAME}-db-data
  certs:
    name: ${COMPOSE_PROJECT_NAME}-certs
  esdata01:
    name: ${COMPOSE_PROJECT_NAME}-esdata01
