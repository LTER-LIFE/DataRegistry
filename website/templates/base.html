    <script type="application/javascript">

        // Bootstrap tooltip
        $(document).ready(function () {
            $("body").tooltip({selector: '[data-toggle=tooltip]'});
        });

        // A helper function to add a class to a certain element
        function addClasses(class_names) {
            class_names.forEach(class_name => element.classList.add(class_name));
            return class_names;
        }

        // A helper function to remove a class to a certain element
        function removeClasses(class_names) {
            class_names.forEach(class_name => element.classList.add(class_name));
            return class_names;
        }

        // A helper function that waits for an element that doesn't exist yet
        function modifyFutureElement(selector, class_names, callBack, checkFrequencyInMs, timeoutInMs) {
            var startTimeInMs = Date.now();
            (function loopSearch() {
                element = document.querySelector(selector)
                if (element != null) {
                    callBack(class_names);
                } else {
                    setTimeout(function () {
                        if (timeoutInMs && Date.now() - startTimeInMs > timeoutInMs)
                            return;
                        loopSearch();
                    }, checkFrequencyInMs);
                }
            })();
        }

        // A function to show maps on a specified dif with specified coordinates
        function showMap(div_id, coords) {
            var map = L.map(div_id, {zoomControl: false});

            L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
                doubleClickZoom: true,
                maxBounds: ([[90, -270], [-90, 270]]),
                selectArea: true
            }).addTo(map);

            // center map on result
            map.setView(coords, 16);
        };

    </script>
